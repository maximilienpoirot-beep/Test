<style>

  .ui{position:fixed;z-index:3;pointer-events:none;opacity:0}
  .ui button{pointer-events:auto}

  /* brand */
  .brand{top:30px;left:34px}
  .brand .logo{font-weight:500;font-size:12px;letter-spacing:.46em;display:flex;align-items:center;gap:12px}

  .caption{left:34px;bottom:40px;max-width:560px}
  .chap{display:flex;align-items:center;gap:14px;font-weight:500;font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}

  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(46px,7.4vw,104px);

  .latin{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:22px;color:var(--dim);margin-top:2px}
  .desc{margin-top:16px;font-weight:300;font-size:13px;line-height:1.65;color:var(--dim);max-width:420px}
  .hold{margin-top:24px;width:240px;height:1px;background:var(--faint);position:relative;overflow:hidden}
  .hold i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:var(--fg)}

  .chapters{right:34px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
  .chapters button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:8px 0;
     font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);transition:color .4s}
  .chapters button .bar{width:18px;height:1px;background:currentColor;transition:width .5s cubic-bezier(.2,.8,.2,1)}

// Improved Perlin noise 3D
const PERM = new Uint8Array(512);

  const u = fade(x), v = fade(y), w = fade(z);

/* =====================================================================

// --- SDF primitives: tapered capsule & oriented ellipsoid, smooth-union ---
function cap(a, b, ra, rb, part, k = 0.2) {
  const bax = b[0] - a[0], bay = b[1] - a[1], baz = b[2] - a[2];
  return { t: 0, ax: a[0], ay: a[1], az: a[2], bax, bay, baz, inv: 1 / (bax * bax + bay * bay + baz * baz), ra, rb, part, k };

let SDFPART = 0;
function makeSDF(prims) {
  const n = prims.length;
  return (x, y, z) => {
    let d = 1e9, best = 1e9, part = 0;
    for (let i = 0; i < n; i++) {
      const p = prims[i]; let di;
      if (p.t === 0) {
        const px = x - p.ax, py = y - p.ay, pz = z - p.az;
        let h = (px * p.bax + py * p.bay + pz * p.baz) * p.inv; h = h < 0 ? 0 : h > 1 ? 1 : h;

function sampleSDF(C, f, count, bb, shade, shell = 0.18) {
  const target = Math.min(C.n, C.i + count);
  const [x0, y0, z0, x1, y1, z1] = bb, sx = x1 - x0, sy = y1 - y0, sz = z1 - z0, e = 0.0015;

    e = s * (1 - s) * 4 * 0.14;                      // luminous stripe borders
    for (const E of eyes) {
      const de = Math.hypot(x - E[0], y - E[1], z - E[2]);
      if (de < 0.07) { if (de < 0.026) { c = [0.02, 0.02, 0.02]; e = 0; } else { c = [0.96, 0.78, 0.22]; e = 1.3; } }
      else if (de < 0.09) { c = BLACK; e = 0; }
    }
    c = scl(c, 0.86 + 0.14 * n3);
    const off = R() < 0.14 ? 0.03 + R() * 0.05 : R() * 0.018;   // fur + guard hairs
    C.push(x + nx * off, y + ny * off, z + nz * off, nx, ny, nz, c, e, part);
  });
  fillRemainder(C); coherentOrder(C);
  return C;
}

/* ---------------- HUMPBACK WHALE (Megaptera novaeangliae) ----------------
   parts: 0 body, 1 left fin, 2 right fin, 3 flukes */
function buildWhale(n) {
  const C = new Cloud(n);
  const P = [
    cap([3.95, 0.02, 0], [3.0, 0.12, 0], 0.32, 0.72, 0, 0),
    cap([3.0, 0.12, 0], [1.6, 0.1, 0], 0.72, 1.05, 0, 0.5),
    cap([1.6, 0.1, 0], [0.0, 0.05, 0], 1.05, 1.02, 0, 0.5),
    cap([0.0, 0.05, 0], [-1.6, 0.02, 0], 1.02, 0.78, 0, 0.5),
    cap([-1.6, 0.02, 0], [-3.0, 0.0, 0], 0.78, 0.38, 0, 0.5),
    cap([-3.0, 0.0, 0], [-4.15, 0.0, 0], 0.38, 0.17, 0, 0.4),
    ell([2.5, -0.32, 0], [1.6, 0.6, 0.82], 0, 0.5),
    ell([3.25, 0.18, 0], [0.95, 0.36, 0.62], 0, 0.4),
    ell([-1.75, 0.8, 0], [0.34, 0.2, 0.07], 0, 0.2, [-0.8, 0.6, 0], [0.6, 0.8, 0]),
    ell([-3.1, 0.22, 0], [1.0, 0.22, 0.1], 0, 0.3),
  ];
  const TUB = [];
  for (const s of [-1, 1]) {
    const part = s < 0 ? 1 : 2;
    const root = [1.75, -0.5, 0.8 * s], tip = [0.15, -1.5, 3.95 * s];
    const u = V.norm(V.sub(tip, root));
    const w = V.norm(V.sub([1, 0, 0], V.mul(u, u[0])));
    const half = V.len(V.sub(tip, root)) / 2;
    P.push(ell(V.lerp(root, tip, 0.5), [half * 1.02, 0.36, 0.075], part, 0.25, u, w));
    P.push(ell(V.lerp(root, tip, 0.25), [half * 0.55, 0.4, 0.1], part, 0.2, u, w));
    for (let k = 0; k < 9; k++) {      // leading-edge tubercles
      const t = 0.12 + k * 0.095, a = (t - 0.5) * 2;
      const wid = 0.36 * Math.sqrt(Math.max(0, 1 - a * a)) * 0.9;
      const p = V.add(V.lerp(root, tip, t), V.mul(w, wid));
      P.push(ell(p, [0.06, 0.06, 0.06], 10 + part, 0.04));
      TUB.push(p);
    }
  }
  for (const s of [-1, 1]) {
    const root = [-4.05, 0, 0], tip = [-4.85, 0.0, 1.55 * s];
    const u = V.norm(V.sub(tip, root)), w = V.norm(V.cross([0, 1, 0], u));
    const half = V.len(V.sub(tip, root)) / 2;
    P.push(ell(V.lerp(root, tip, 0.55), [half * 1.1, 0.36, 0.055], 3, 0.15, u, w));
  }
  const f = makeSDF(P);
  const eyes = [projectPoint(f, [2.05, -0.12, 1.1]), projectPoint(f, [2.05, -0.12, -1.1])];
  const DARK = [0.15, 0.18, 0.22], MID = [0.24, 0.27, 0.32], WHITE = [0.86, 0.89, 0.9];
  sampleSDF(C, f, n, [-5.7, -2.2, -4.4, 4.5, 1.4, 4.4], (C, x, y, z, nx, ny, nz, part) => {
    let e = 0;
    let tub = false;
    if (part >= 10) { part -= 10; tub = true; }
    const n1 = noise3(x * 1.2, y * 1.2, z * 1.2), n2 = noise3(x * 3.5 + 7, y * 3.5, z * 3.5);
    worley(x * 6, y * 6, z * 6);
    const cell = smooth(0, 0.25, WF2 - WF1);
    let c = mixc(DARK, MID, clamp01(0.5 + n2 * 0.8));
    let white = 0;
    if (part === 0) {
      white = smooth(-0.15, -0.65, ny + n1 * 0.3) * smooth(-2.6, -0.5, x);
      if (x > 0.3 && ny < -0.25) white *= 0.62 + 0.38 * smooth(-0.2, 0.6, Math.sin(z * 26 + Math.sin(x * 1.5) * 1.5)); // throat pleats
      if (x > 1.9 && y > -0.1 && y < -0.02 && Math.abs(z) > 0.3) c = [0.05, 0.06, 0.07];      // mouth line
    } else if (part === 1 || part === 2) {
      white = (0.72 + 0.28 * smooth(-0.3, 0.3, n2)) * (ny > 0.2 ? smooth(-0.2, 0.4, n1 + 0.15) : 1);
    } else if (part === 3) {
      white = ny < 0 ? smooth(-0.2, 0.3, n1 * 1.4 + 0.3) : 0.05;
    }
    c = mixc(c, WHITE, white);
    c = scl(c, 0.86 + 0.24 * cell);
    // barnacle clusters on the chin & fins
    if ((x > 2.6 && ny < -0.1) || (part > 0 && part < 3 && x > 1.2)) { if (noise3(x * 9, y * 9, z * 9) > 0.42) c = [0.7, 0.7, 0.66]; }
    // bioluminescence
    if (R() < 0.012) e = 0.25 + R() * 0.6;
    if (x > 2.55 && ny > 0.35 && WF1 < 0.1) { e = 0.8; c = [0.45, 0.6, 0.65]; }          // head tubercles
    if (Math.abs(nz) > 0.86 && y > -0.05 && y < 0.09 && x > -3 && x < 2 && Math.sin(x * 14) > 0.94) e = 0.9; // lateral line
    if (tub) { e = 0.55; c = [0.62, 0.7, 0.72]; }
    if (part === 3 && Math.abs(ny) < 0.3 && R() < 0.3) e = 0.6;                         // fluke edge
    for (const E of eyes) { const de = Math.hypot(x - E[0], y - E[1], z - E[2]); if (de < 0.08) { c = [0.02, 0.02, 0.03]; e = de < 0.035 ? 0.6 : 0; } }
    C.push(x, y, z, nx, ny, nz, c, e, part);
  }, 0.22);
  fillRemainder(C); coherentOrder(C);
  return C;
}

const NOISE = /* glsl */`
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+10.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.5-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 105.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;
const FOG = /* glsl */`
uniform vec3 uFogColor; uniform float uFogDensity;
vec3 applyFog(vec3 col, float dist, float k){ float f = 1.0 - exp(-uFogDensity*uFogDensity*dist*dist*k); return mix(col, uFogColor, clamp(f,0.0,1.0)); }`;
const CAUSTIC = /* glsl */`
float caustic(vec2 p, float t){
  vec2 q = mod(p, 6.2831853) - 250.0; vec2 i = q; float c = 1.0; float inten = 0.005;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - (3.5 / float(n + 1)));
    i = q + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(q.x / (sin(i.x + tt) / inten), q.y / (cos(i.y + tt) / inten)));
  }
  c /= 4.0; c = 1.17 - pow(c, 1.4); return pow(abs(c), 8.0);
}`;
const QUAD_VS = /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;

// MeshStandardMaterial patch: noise dissolve with glowing edge (+ optional underwater caustics)
function enhanceStd(mat, vis, edge, caustics = false) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uVis = vis; sh.uniforms.uTime = G.uTime; sh.uniforms.uEdge = { value: new THREE.Color(...edge) };
    sh.vertexShader = 'varying vec3 vWP;\n' + sh.vertexShader.replace('#include <fog_vertex>', `#include <fog_vertex>
      vec4 wpp = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        wpp = instanceMatrix * wpp;
      #endif

    sh.fragmentShader = 'varying vec3 vWP;\nuniform float uVis;\nuniform float uTime;\nuniform vec3 uEdge;\n' + NOISE + '\n' + (caustics ? CAUSTIC + '\n' : '') +
      sh.fragmentShader

        .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>

  return mat;
}

  g.instanceCount = items.length;
  const m = new THREE.Mesh(g, new THREE.ShaderMaterial({
    uniforms: { uTime: G.uTime, uVis: vis, uDir: { value: new THREE.Vector3(...dir).normalize() }, uColor: { value: new THREE.Color(...color) } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      attribute vec3 aStart; attribute vec4 aData; uniform vec3 uDir;
      varying vec2 vUv; varying float vI; varying float vPhase; varying vec3 vWP;
      void main(){
        float along = 1.0 - uv.y;
        vec3 base = aStart + uDir*aData.x*along;
        vec3 toCam = normalize(cameraPosition - base);
        vec3 side = normalize(cross(uDir, toCam));
        float w = aData.y*(0.6 + along*0.9);
        vec3 wp = base + side*(uv.x - 0.5)*w;
        vUv = vec2(uv.x, along); vI = aData.w; vPhase = aData.z; vWP = wp;
        gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform float uVis; uniform float uTime; uniform vec3 uColor;
      varying vec2 vUv; varying float vI; varying float vPhase; varying vec3 vWP;
      ${NOISE}
      void main(){
        float x = abs(vUv.x*2.0 - 1.0);
        float core = pow(1.0 - x, 2.2);
        float along = smoothstep(0.0, 0.15, vUv.y)*smoothstep(1.0, 0.45, vUv.y);
        float n = snoise(vec3(vUv.x*3.0 + vPhase, vUv.y*2.0 - uTime*0.08, uTime*0.05 + vPhase))*0.5 + 0.5;
        float a = core*along*(0.5 + 0.5*n)*vI*uVis;
        a *= smoothstep(1.5, 8.0, length(cameraPosition - vWP));
        gl_FragColor = vec4(uColor*a, 1.0);
      }`,
  }));
  m.frustumCulled = false;
  return m;
}

/* ---------------- 6a. MOUNTAINS ---------------- */
function buildMountains() {
  const grp = new THREE.Group();
  const g = new THREE.PlaneGeometry(700, 700, 240, 240); g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), r = Math.hypot(x, z);
    let sum = 0, amp = 1, freq = 0.0055, prev = 1;
    for (let o = 0; o < 6; o++) { let nn = 1 - Math.abs(noise3(x * freq + 31.7, o * 7.3, z * freq - 12.1)); nn *= nn; sum += nn * amp * prev; prev = nn; amp *= 0.5; freq *= 2.1; }
    const big = 0.6 + 0.6 * noise3(x * 0.002, 3.3, z * 0.002);
    pos.setY(i, -70 + sum * 95 * big * smooth(20, 130, r) + noise3(x * 0.02, 1, z * 0.02) * 6);
  }
  g.computeVertexNormals();
  const nrm = g.attributes.normal, col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i), ny = nrm.getY(i);
    const nn = noise3(x * 0.05, y * 0.05, z * 0.05);
    let c = mixc([0.05, 0.048, 0.05], [0.12, 0.1, 0.09], clamp01(0.5 + nn));
    c = mixc(c, [0.025, 0.04, 0.03], smooth(-50, -62, y));
    const snow = smooth(-34 + nn * 14, -22 + nn * 14, y) * smooth(0.5, 0.72, ny);
    c = mixc(c, [0.85, 0.89, 0.95], snow);
    col.set(c, i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const terrain = new THREE.Mesh(g, enhanceStd(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 }), envVis[0], [0.8, 0.9, 1.0]));
  terrain.frustumCulled = false;
  grp.add(terrain);
  const mist = [];
  for (let i = 0; i < 18; i++) { const a = R() * TAU, r = 8 + R() * 70; mist.push({ p: [Math.cos(a) * r, -10 - R() * 25, Math.sin(a) * r], size: 25 + R() * 35, alpha: 0.35 + R() * 0.3 }); }
  for (let i = 0; i < 10; i++) { const a = R() * TAU, r = 120 + R() * 140; mist.push({ p: [Math.cos(a) * r, -5 + R() * 20, Math.sin(a) * r], size: 70 + R() * 70, alpha: 0.3 + R() * 0.3 }); }
  grp.add(makeMist(mist, [0.42, 0.5, 0.62], [1.1, 1.1, 1.15], envVis[0]));
  return grp;
}

/* ---------------- 6b. JUNGLE ---------------- */
function buildJungle() {
  const grp = new THREE.Group();
  const GY = -1.76;
  // ground
  const gg = new THREE.PlaneGeometry(220, 220, 120, 120); gg.rotateX(-Math.PI / 2);
  const gp = gg.attributes.position, gc = new Float32Array(gp.count * 3);
  for (let i = 0; i < gp.count; i++) {
    const x = gp.getX(i), z = gp.getZ(i), r = Math.hypot(x, z);
    gp.setY(i, GY + noise3(x * 0.3, 0, z * 0.3) * 0.25 * smooth(5, 14, r) + noise3(x * 0.05, 2, z * 0.05) * 2.5 * smooth(15, 45, r));
    const nn = noise3(x * 0.4, 5, z * 0.4), m = noise3(x * 0.08, 9, z * 0.08);
    let c = mixc([0.05, 0.035, 0.02], [0.09, 0.055, 0.025], clamp01(0.5 + nn));
    c = mixc(c, [0.05, 0.09, 0.02], smooth(-0.1, 0.4, m));
    gc.set(c, i * 3);
  }
  gg.computeVertexNormals(); gg.setAttribute('color', new THREE.BufferAttribute(gc, 3));
  const ground = new THREE.Mesh(gg, enhanceStd(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }), envVis[1], [0.9, 0.7, 0.2]));
  ground.frustumCulled = false; grp.add(ground);
  // contact shadow
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(8.5, 3.6).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
    uniforms: { uVis: envVis[1] }, transparent: true, depthWrite: false,
    vertexShader: QUAD_VS,
    fragmentShader: `uniform float uVis; varying vec2 vUv; void main(){ vec2 p = (vUv-0.5)*2.0; float a = pow(1.0 - smoothstep(0.0,1.0,length(p)), 1.6)*0.7*uVis; gl_FragColor = vec4(0.0,0.0,0.0,a); }`,
  }));
  sh.position.set(-0.7, GY + 0.03, 0); grp.add(sh);
  // trunks
  const tg = new THREE.CylinderGeometry(0.55, 0.9, 70, 14, 30, true); tg.translate(0, 35, 0);
  const tp = tg.attributes.position, tc = new Float32Array(tp.count * 3);
  for (let i = 0; i < tp.count; i++) {
    const x = tp.getX(i), y = tp.getY(i), z = tp.getZ(i), a = Math.atan2(z, x);
    const st = noise3(Math.cos(a) * 3, y * 0.08, Math.sin(a) * 3), rr = 1 + 0.09 * noise3(Math.cos(a) * 2, y * 0.3, Math.sin(a) * 2);
    tp.setX(i, x * rr); tp.setZ(i, z * rr);
    let c = mixc([0.06, 0.045, 0.03], [0.16, 0.13, 0.09], clamp01(0.5 + st));
    c = mixc(c, [0.06, 0.11, 0.03], smooth(10, 0, y) * smooth(-0.4, 0.4, Math.cos(a) + st));
    tc.set(c, i * 3);
  }
  tg.computeVertexNormals(); tg.setAttribute('color', new THREE.BufferAttribute(tc, 3));
  const nT = 46;
  const trunks = new THREE.InstancedMesh(tg, enhanceStd(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }), envVis[1], [0.9, 0.7, 0.2]), nT);
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new THREE.Vector3(), Pv = new THREE.Vector3(), E = new THREE.Euler();
  const trunkPos = [];
  for (let i = 0; i < nT; i++) {
    const a = R() * TAU, r = 13 + Math.pow(R(), 0.8) * 50, s = 0.6 + R() * 1.5;
    Pv.set(Math.cos(a) * r, GY - 0.5, Math.sin(a) * r); trunkPos.push(Pv.clone());
    Q.setFromEuler(E.set((R() - .5) * 0.08, R() * TAU, (R() - .5) * 0.08)); S.set(s, 1, s);
    trunks.setMatrixAt(i, M.compose(Pv, Q, S));
  }
  trunks.frustumCulled = false; grp.add(trunks);
  // lianas
  const lianaMat = enhanceStd(new THREE.MeshStandardMaterial({ color: 0x1c2410, roughness: 1 }), envVis[1], [0.9, 0.7, 0.2]);
  for (let i = 0; i < 14; i++) {
    const t0 = trunkPos[i % trunkPos.length], a = R() * TAU, r = 12 + R() * 22;
    const p0 = new THREE.Vector3(t0.x, 18 + R() * 10, t0.z), p2 = new THREE.Vector3(Math.cos(a) * r, 14 + R() * 10, Math.sin(a) * r);
    const p1 = p0.clone().lerp(p2, 0.5); p1.y = 2 + R() * 6;
    const curve = new THREE.QuadraticBezierCurve3(p0, p1, p2);
    const l = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.05 + R() * 0.05, 5), lianaMat);
    l.frustumCulled = false; grp.add(l);
  }
  // leaves (instanced, sprouting with the dissolve)
  const lg = new THREE.PlaneGeometry(1, 0.38, 8, 2); lg.translate(0.5, 0, 0); lg.rotateX(-Math.PI / 2);
  const lp = lg.attributes.position;
  for (let i = 0; i < lp.count; i++) { const x = lp.getX(i), z = lp.getZ(i); lp.setY(i, -0.28 * x * x + Math.abs(z) * 0.35); }
  lg.computeVertexNormals();
  const leaves = [];
  const plant = (cx, cz, cy, count, sMin, sMax, pMin, pMax, dMin) => {
    for (let k = 0; k < count; k++) leaves.push({ p: [cx + (R() - .5) * 0.3, cy, cz + (R() - .5) * 0.3], yaw: R() * TAU, pitch: lerp(pMin, pMax, R()), roll: (R() - .5) * 0.6, s: lerp(sMin, sMax, R()), delay: dMin + R() * 0.25 });
  };
  const nPl = IS_MOBILE ? 0.55 : 1;
  for (let i = 0; i < 260 * nPl; i++) { const a = R() * TAU, r = 14 + Math.pow(R(), 0.7) * 34; plant(Math.cos(a) * r, Math.sin(a) * r, GY + R() * 0.6, 7 + Math.floor(R() * 8), 1.2, 3.6, 0.25, 1.0, 0.15 + R() * 0.3); }
  for (let i = 0; i < 80 * nPl; i++) { const a = R() * TAU, r = 5.6 + R() * 3.4; plant(Math.cos(a) * r, Math.sin(a) * r, GY, 5 + Math.floor(R() * 6), 0.5, 1.3, 0.05, 0.35, 0.05 + R() * 0.2); }
  for (let i = 0; i < 70 * nPl; i++) { const t = trunkPos[Math.floor(R() * trunkPos.length)]; plant(t.x + (R() - .5) * 3, t.z + (R() - .5) * 3, 2 + R() * 14, 6 + Math.floor(R() * 6), 0.9, 2.0, -0.4, 0.5, 0.3 + R() * 0.3); }
  for (let i = 0; i < 300 * nPl; i++) { const a = R() * TAU, r = R() * 42; plant(Math.cos(a) * r, Math.sin(a) * r, 11 + R() * 14, 12 + Math.floor(R() * 8), 1.0, 2.3, -0.5, 0.4, 0.35 + R() * 0.3); }
  const lm = new THREE.InstancedMesh(lg, new THREE.ShaderMaterial({
    uniforms: { ...G, uVis: envVis[1] }, side: THREE.DoubleSide,
    vertexShader: /* glsl */`
      attribute vec4 aLeaf; uniform float uTime; uniform float uVis;
      varying vec2 vUv; varying vec3 vN; varying vec3 vWP; varying vec4 vLeaf; varying float vGrow;
      void main(){
        float g = smoothstep(aLeaf.y, aLeaf.y + 0.3, uVis);
        vec3 p = position;
        p.y += sin(uTime*1.3 + aLeaf.z + p.x*1.5)*0.06*p.x + sin(uTime*2.7 + aLeaf.z*3.0)*0.02*p.x;
        p *= g;
        vec4 wp = modelMatrix * instanceMatrix * vec4(p, 1.0);
        vN = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * normal);
        vUv = uv; vWP = wp.xyz; vLeaf = aLeaf; vGrow = g;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uHemiSky; uniform vec3 uHemiGround;
      varying vec2 vUv; varying vec3 vN; varying vec3 vWP; varying vec4 vLeaf; varying float vGrow;
      ${FOG}
      void main(){
        if (vGrow < 0.01) discard;
        float u = vUv.x; float v = vUv.y*2.0 - 1.0;
        float w = pow(sin(3.14159*clamp(u,0.0,1.0)), 0.65)*(1.0 - 0.25*u);
        if (abs(v) > w) discard;
        if (vLeaf.w > 0.5 && abs(v) > 0.15 && fract(u*7.0 + abs(v)*1.5 + vLeaf.x*3.0) < 0.07) discard;
        vec3 base = mix(vec3(0.018,0.06,0.008), vec3(0.06,0.16,0.015), vLeaf.x);
        base = mix(base, vec3(0.16,0.2,0.03), smoothstep(0.6,1.0,u)*0.3*vLeaf.x);
        float midrib = 1.0 - smoothstep(0.0, 0.05, abs(v));
        float veins = smoothstep(0.9, 1.0, cos((u*18.0 - abs(v)*3.0)*3.14159))*0.6;
        base += vec3(0.05,0.08,0.01)*(midrib + veins);
        vec3 N = normalize(vN); if (!gl_FrontFacing) N = -N;
        vec3 V = normalize(cameraPosition - vWP);
        vec3 L = normalize(uSunDir);
        float ndl = dot(N, L);
        vec3 hemi = mix(uHemiGround, uHemiSky, N.y*0.5 + 0.5);
        vec3 col = base*(hemi + uSunCol*max(ndl, 0.0));
        float trans = max(-ndl, 0.0)*(0.35 + 0.65*pow(max(dot(-V, L), 0.0), 4.0));
        col += base*vec3(1.2,1.6,0.4)*uSunCol*trans*0.9;
        col += uSunCol*pow(max(dot(N, normalize(L + V)), 0.0), 50.0)*0.12;
        col = applyFog(col, length(cameraPosition - vWP), 1.0);
        gl_FragColor = vec4(col, 1.0);
      }`,
  }), leaves.length);
  const la = new Float32Array(leaves.length * 4);
  leaves.forEach((L, i) => {
    Q.setFromEuler(E.set(L.roll, L.yaw, L.pitch, 'YZX')); S.setScalar(L.s); Pv.set(...L.p);
    lm.setMatrixAt(i, M.compose(Pv, Q, S));
    la.set([R(), L.delay, R() * TAU, R() < 0.35 ? 1 : 0], i * 4);
  });
  lg.setAttribute('aLeaf', new THREE.InstancedBufferAttribute(la, 4));
  lm.frustumCulled = false; grp.add(lm);
  // god rays through the canopy
  const sd = new THREE.Vector3(...ENV[1].dir).normalize(), rays = [];
  for (let i = 0; i < 11; i++) {
    const a = R() * TAU, r = 2 + R() * 22, gx = Math.cos(a) * r, gz = Math.sin(a) * r, top = 22;
    const L = (top - GY) / sd.y;
    rays.push({ p: [gx + sd.x * L, top, gz + sd.z * L], len: L * 1.02, width: 1.4 + R() * 3.2, i: 0.5 + R() * 0.6 });
  }
  grp.add(makeRays(rays, [-sd.x, -sd.y, -sd.z], [1.0, 0.8, 0.45], envVis[1]));
  return grp;
}

/* ---------------- 6c. OCEAN ---------------- */
function buildOcean() {
  const grp = new THREE.Group();
  const seaY = (x, z) => -9.5 + 0.5 * Math.sin(x * 0.18 + noise3(x * 0.05, 0, z * 0.05) * 3) + noise3(x * 0.03, 1, z * 0.03) * 3;
  const sg = new THREE.PlaneGeometry(400, 400, 160, 160); sg.rotateX(-Math.PI / 2);
  const sp = sg.attributes.position, scol = new Float32Array(sp.count * 3);
  for (let i = 0; i < sp.count; i++) {
    const x = sp.getX(i), z = sp.getZ(i); sp.setY(i, seaY(x, z));
    scol.set(mixc([0.22, 0.2, 0.16], [0.36, 0.32, 0.25], clamp01(0.5 + noise3(x * 0.2, 3, z * 0.2))), i * 3);
  }
  sg.computeVertexNormals(); sg.setAttribute('color', new THREE.BufferAttribute(scol, 3));
  const sea = new THREE.Mesh(sg, enhanceStd(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }), envVis[2], [0.2, 0.9, 1.0], true));
  sea.frustumCulled = false; grp.add(sea);
  // rocks
  const rg = new THREE.IcosahedronGeometry(1, 3);
  const rp = rg.attributes.position;
  for (let i = 0; i < rp.count; i++) { const v = new THREE.Vector3().fromBufferAttribute(rp, i); v.multiplyScalar(1 + 0.35 * noise3(v.x * 1.6, v.y * 1.6, v.z * 1.6) + 0.1 * noise3(v.x * 5, v.y * 5, v.z * 5)); rp.setXYZ(i, v.x, v.y, v.z); }
  rg.computeVertexNormals();
  const nR = 80, rocks = new THREE.InstancedMesh(rg, enhanceStd(new THREE.MeshStandardMaterial({ color: 0x1a1a1f, roughness: 0.95 }), envVis[2], [0.2, 0.9, 1.0], true), nR);
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new THREE.Vector3(), Pv = new THREE.Vector3(), E = new THREE.Euler();
  const rockPos = [];
  for (let i = 0; i < nR; i++) {
    const a = R() * TAU, r = 5 + Math.pow(R(), 0.8) * 50, x = Math.cos(a) * r, z = Math.sin(a) * r, s = 0.8 + R() * 3.5;
    Pv.set(x, seaY(x, z) + s * 0.1, z); rockPos.push([x, z, s]);
    Q.setFromEuler(E.set(R() * TAU, R() * TAU, R() * TAU)); S.set(s, s * (0.45 + R() * 0.4), s * (0.7 + R() * 0.5));
    rocks.setMatrixAt(i, M.compose(Pv, Q, S));
  }
  rocks.frustumCulled = false; grp.add(rocks);
  // bioluminescent corals / anemones
  const cg = new THREE.CylinderGeometry(0.035, 0.09, 1, 6, 6, true); cg.translate(0, 0.5, 0);
  const nC = IS_MOBILE ? 1400 : 2600, corals = [];
  for (let k = 0; corals.length < nC; k++) {
    const rk = rockPos[k % rockPos.length], useRock = R() < 0.6;
    const a = R() * TAU, r = 6 + R() * 34;
    const cx = useRock ? rk[0] : Math.cos(a) * r, cz = useRock ? rk[1] : Math.sin(a) * r;
    const hue = R(), cnt = 20 + Math.floor(R() * 30), spread = useRock ? rk[2] * 0.7 : 1.4;
    for (let j = 0; j < cnt && corals.length < nC; j++) {
      const x = cx + (R() - .5) * spread * 2, z = cz + (R() - .5) * spread * 2;
      corals.push({ x, z, y: seaY(x, z) + (useRock ? rk[2] * 0.35 * R() : 0), hue: (hue + (R() - .5) * 0.15 + 1) % 1, s: 0.6 + R() * 0.9, len: 0.5 + R() * 2.2 });
    }
  }
  const cm = new THREE.InstancedMesh(cg, new THREE.ShaderMaterial({
    uniforms: { ...G, uVis: envVis[2] },
    vertexShader: /* glsl */`
      attribute vec4 aCoral; uniform float uTime; uniform float uVis;
      varying float vH; varying vec3 vN; varying vec3 vWP; varying vec4 vC;
      void main(){
        float g = smoothstep(aCoral.y, aCoral.y + 0.35, uVis);
        vec3 p = position; float h = p.y;
        p.x += sin(uTime*0.9 + aCoral.z + h*2.0)*0.12*h*h;
        p.z += cos(uTime*0.7 + aCoral.z*1.3 + h*1.5)*0.1*h*h;
        p *= g;
        vec4 wp = modelMatrix * instanceMatrix * vec4(p, 1.0);
        vN = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * normal);
        vH = h; vWP = wp.xyz; vC = aCoral;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: /* glsl */`
      uniform float uTime; uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uHemiSky;
      varying float vH; varying vec3 vN; varying vec3 vWP; varying vec4 vC;
      ${FOG}
      void main(){
        vec3 N = normalize(vN);
        vec3 gc = vC.x < 0.3 ? vec3(0.15,1.0,0.85) : (vC.x < 0.55 ? vec3(1.0,0.25,0.75) : (vC.x < 0.8 ? vec3(0.55,0.35,1.0) : vec3(0.55,1.0,0.25)));
        vec3 col = vec3(0.02,0.015,0.03)*(uHemiSky + uSunCol*max(dot(N, normalize(uSunDir)), 0.0));
        float pulse = 0.6 + 0.4*sin(uTime*2.0 + vC.z*5.0 + vH*6.0);
        col += gc*pow(vH, 2.5)*(1.2 + 2.6*pulse)*vC.w;
        col = applyFog(col, length(cameraPosition - vWP), 0.55);
        gl_FragColor = vec4(col, 1.0);
      }`,
  }), corals.length);
  const ca = new Float32Array(corals.length * 4);
  corals.forEach((c, i) => {
    Q.setFromEuler(E.set((R() - .5) * 0.9, R() * TAU, (R() - .5) * 0.9)); S.set(c.s, c.len, c.s); Pv.set(c.x, c.y, c.z);
    cm.setMatrixAt(i, M.compose(Pv, Q, S));
    ca.set([c.hue, 0.2 + R() * 0.45, R() * TAU, 0.6 + R() * 0.8], i * 4);
  });
  cg.setAttribute('aCoral', new THREE.InstancedBufferAttribute(ca, 4));
  cm.frustumCulled = false; grp.add(cm);
  // light shafts from the surface
  const sd = new THREE.Vector3(...ENV[2].dir).normalize(), rays = [];
  for (let i = 0; i < 12; i++) { const a = R() * TAU, r = R() * 30; rays.push({ p: [Math.cos(a) * r, 26, Math.sin(a) * r], len: 42, width: 3 + R() * 6, i: 0.25 + R() * 0.4 }); }
  grp.add(makeRays(rays, [-sd.x, -sd.y, -sd.z], [0.35, 0.75, 1.0], envVis[2]));
  return grp;
}

/* =====================================================================
   7. AMBIENT PARTICLES (snow / pollen / marine snow & plankton)
   ===================================================================== */
const AMB_N = IS_MOBILE ? 2500 : 5000;
const ambOffset = new THREE.Vector3();
function buildAmbient() {
  const g = new THREE.BufferGeometry();
  const s = new Float32Array(AMB_N * 4); for (let i = 0; i < s.length; i++) s[i] = R();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(AMB_N * 3), 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(s, 4));
  const m = new THREE.Points(g, new THREE.ShaderMaterial({

function hideCaption() {
  gsap.to('#name .ch', { yPercent: -115, opacity: 0, duration: 0.45, stagger: 0.015, ease: 'expo.in' });
  gsap.to(['#chap', '#latin', '#desc'], { opacity: 0, y: -8, duration: 0.4, ease: 'power2.in' });
}

function goTo(to) {
  if (!S.started) return;
  if (S.busy) { S.queued = to; if (S.tl) S.tl.timeScale(1.8); return; }
  if (to === S.form) return;
  const from = S.form;
  S.busy = true; S.hold = 0;
  U.uFromF.value = from; U.uToF.value = to; U.uMode.value = from; U.uProgress.value = 0;
  // fold user orbit offsets into the base orbit (continuous), then reframe
  cam.theta += cam.uT; cam.uTt -= cam.uT; cam.uT = 0;
  cam.phi += cam.uP; cam.uPt -= cam.uP; cam.uP = 0;
  let d = ((PREF[to].theta - cam.theta) % TAU + TAU * 1.5) % TAU - Math.PI;
  S.swirlDir = d >= 0 ? 1 : -1;
  const wt = { w0: 0, w1: 0, w2: 0 }; wt['w' + to] = 1;
  const tl = gsap.timeline({ onComplete: () => {
    S.form = to; U.uFromF.value = to; U.uProgress.value = 0; S.busy = false; S.tl = null; S.hold = 0;
    if (S.queued !== null) { const q = S.queued; S.queued = null; if (q !== S.form) goTo(q); }
  } });
  S.tl = tl;
  tl.to(U.uProgress, { value: 1, duration: 2.9, ease: 'power1.inOut' }, 0)
    // ultra-fast push-in through the swarm
    .to(cam, { zoomMul: 0.45, fovKick: -10, duration: 0.5, ease: 'expo.in' }, 0)
    .to(FX, { zoom: 0.16, ca: 0.014, boost: 1, duration: 0.5, ease: 'expo.in' }, 0)
    .to(FX, { flash: 0.22, duration: 0.08, ease: 'none' }, 0.46)
    .to(FX, { flash: 0, duration: 0.8, ease: 'power2.out' }, 0.54)
    .to(cam, { zoomMul: 1, fovKick: 0, duration: 2.4, ease: 'expo.out' }, 0.52)
    .to(FX, { zoom: 0, ca: 0.0016, boost: 0, duration: 1.9, ease: 'power3.out' }, 0.52)
    // orbit re-framing for the new subject
    .to(cam, { theta: cam.theta + d, uTt: 0, uPt: 0, duration: 2.8, ease: 'power3.inOut' }, 0.1)
    .to(cam, { phi: PREF[to].phi, r: PREF[to].r, ty: PREF[to].ty, minPhi: PREF[to].minPhi, duration: 2.5, ease: 'power2.inOut' }, 0.3)
    // ecosystem cross-dissolve
    .to(W, { ...wt, duration: 2.3, ease: 'sine.inOut' }, 0.35)
    .call(hideCaption, null, 0.15)
    .call(() => setCaption(to), null, 1.0);
}
const next = () => goTo(((S.busy && S.queued !== null ? S.queued : (S.busy ? +U.uToF.value : S.form)) + 1) % 3);

// input
canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); canvas.classList.add('drag'); lastInteract = performance.now(); });
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
  cam.uTt -= dx * 0.006; cam.uPt += dy * 0.0045; lastInteract = performance.now();
});
const endDrag = () => { dragging = false; canvas.classList.remove('drag'); };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.zoom = Math.max(0.55, Math.min(1.8, cam.zoom * Math.exp(e.deltaY * 0.0009))); lastInteract = performance.now(); }, { passive: false });
canvas.addEventListener('dblclick', next);
$('#switch').addEventListener('click', next);
document.querySelectorAll('#chapters button').forEach(b => b.addEventListener('click', () => goTo(+b.dataset.i)));
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter' && document.activeElement === canvas) { e.preventDefault(); next(); }
  if (e.key >= '1' && e.key <= '3') goTo(+e.key - 1);
});

function updateCamera(dt, t) {
  const k = 1 - Math.exp(-dt * 5);
  if (!dragging && performance.now() - lastInteract > 2500) cam.uTt += dt * 0.045;
  cam.uPt = Math.max(cam.minPhi - cam.phi, Math.min(1.25 - cam.phi, cam.uPt));
  cam.uT += (cam.uTt - cam.uT) * k; cam.uP += (cam.uPt - cam.uP) * k;
  const swirl = Math.sin(Math.PI * U.uProgress.value) * 0.55 * S.swirlDir;
  const th = cam.theta + cam.uT + swirl, ph = Math.max(cam.minPhi, Math.min(1.25, cam.phi + cam.uP));
  const r = cam.r * cam.zoom * cam.zoomMul;
  const fy = (Math.sin(t * 0.6) * 0.3 * W.w0 + Math.sin(t * 0.35) * 0.3 * W.w2) * 0.85;
  target.set(0, cam.ty + fy, 0);
  camera.position.set(target.x + r * Math.cos(ph) * Math.sin(th), target.y + r * Math.sin(ph), target.z + r * Math.cos(ph) * Math.cos(th));
  const sh = 0.05 + FX.boost * 0.22;   // handheld drift + transition shake
  camera.position.x += noise3(t * (0.3 + FX.boost * 3), 5.1, 1.7) * sh;
  camera.position.y += noise3(2.3, t * (0.3 + FX.boost * 3), 4.4) * sh;
  camera.position.z += noise3(7.7, 3.9, t * (0.3 + FX.boost * 3)) * sh;
  camera.lookAt(target);
  camera.fov = 40 + cam.fovKick; camera.updateProjectionMatrix();
  return r;
}

const _c = new THREE.Color(), _v = new THREE.Vector3();
function blendArr(key, w) { return [0, 1, 2].map(j => ENV[0][key][j] * w[0] + ENV[1][key][j] * w[1] + ENV[2][key][j] * w[2]); }
function blendNum(key, w) { return ENV[0][key] * w[0] + ENV[1][key] * w[1] + ENV[2][key] * w[2]; }
function updateEnv(groups) {
  const s = W.w0 + W.w1 + W.w2 || 1, w = [W.w0 / s, W.w1 / s, W.w2 / s];
  G.uW.value.set(w[0], w[1], w[2]);
  const fog = blendArr('fog', w); G.uFogColor.value.setRGB(...fog); scene.fog.color.setRGB(...fog);
  const dens = blendNum('dens', w); G.uFogDensity.value = dens; scene.fog.density = dens;
  _v.set(...blendArr('dir', w)).normalize(); G.uSunDir.value.copy(_v); sunLight.position.copy(_v).multiplyScalar(100);
  const sunI = blendNum('sunI', w), sun = blendArr('sun', w);
  G.uSunCol.value.setRGB(sun[0] * sunI, sun[1] * sunI, sun[2] * sunI); sunLight.color.setRGB(...sun); sunLight.intensity = sunI * Math.PI;
  const hemiI = blendNum('hemiI', w), sk = blendArr('sky', w), gn = blendArr('gnd', w);
  G.uHemiSky.value.setRGB(sk[0] * hemiI, sk[1] * hemiI, sk[2] * hemiI); G.uHemiGround.value.setRGB(gn[0] * hemiI, gn[1] * hemiI, gn[2] * hemiI);
  hemiLight.color.setRGB(...sk); hemiLight.groundColor.setRGB(...gn); hemiLight.intensity = hemiI * Math.PI;
  G.uRimCol.value.setRGB(...blendArr('rim', w));
  finalMat.uniforms.uTint.value.set(...blendArr('tint', w));
  renderer.toneMappingExposure = blendNum('expo', w) * (1 + FX.flash * 0.6);
  bloomPass.strength = blendNum('bloomS', w) * (1 + FX.boost * 0.9);
  bloomPass.threshold = blendNum('bloomT', w) * (1 - FX.boost * 0.25);
  for (let i = 0; i < 3; i++) { const v = w[i] * FX.envIntro; envVis[i].value = v; groups[i].visible = v > 0.002; }
  return blendNum('dof', w);
}

/* =====================================================================
   11. BOOT
   ===================================================================== */
const frame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
const setLoad = (p, txt) => { $('#ldBar').style.transform = `scaleX(${p})`; $('#ldTxt').textContent = txt; };

async function boot() {
  setLoad(0.06, 'Plumage de l’aigle'); await frame();
  const eagle = buildEagle(N);
  setLoad(0.32, 'Pelage du tigre'); await frame();
  const tiger = buildTiger(N);
  setLoad(0.58, 'Peau de la baleine'); await frame();
  const whale = buildWhale(N);
  setLoad(0.78, 'Écosystèmes'); await frame();
  const groups = [buildMountains(), buildJungle(), buildOcean()];
  groups.forEach(g => scene.add(g));
  const particles = buildParticles(eagle, tiger, whale); scene.add(particles);
  const ambient = buildAmbient(); scene.add(ambient);
  $('#mParts').textContent = (N / 1000).toFixed(0) + 'K';
  setLoad(0.92, 'Compilation des shaders'); await frame();
  updateEnv(groups);
  groups.forEach(g => g.visible = true);
  [0, 1, 2].forEach(i => envVis[i].value = 1);
  updateCamera(0.016, 0);
  renderer.compile(scene, camera);
  renderer.setRenderTarget(sceneRT); renderer.render(scene, camera); renderer.setRenderTarget(null);
  setLoad(1, 'Prêt'); await frame();

  // intro choreography
  $('#loader').style.opacity = 0; setTimeout(() => $('#loader').remove(), 1300);
  cam.zoomMul = 2.1;
  gsap.to(U.uIntro, { value: 1, duration: 3.8, ease: 'power2.out', delay: 0.2 });
  gsap.to(ambient.material.uniforms.uIntro, { value: 1, duration: 3, delay: 0.6 });
  gsap.to(cam, { zoomMul: 1, duration: 4.2, ease: 'expo.out', delay: 0.2 });
  gsap.to(FX, { envIntro: 1, duration: 3.0, ease: 'power2.inOut', delay: 0.4 });
  gsap.to('.ui', { opacity: 1, duration: 1.6, delay: 1.4, stagger: 0.12 });
  setCaption(0, true);
  setTimeout(() => { S.started = true; }, 2600);
  if (location.hash === '#debug') window.__meta = { goTo, S, U, W, FX, cam, gsap, PREF };   // test hook only

  let last = performance.now(), time = 0, fpsAcc = 0, fpsN = 0, slow = 0, degraded = false;
  const holdBar = $('#hold');
  renderer.setAnimationLoop(() => {
    const now = performance.now(), dt = Math.min((now - last) / 1000, 0.05); last = now; time += dt;
    G.uTime.value = time;
    const dofK = updateEnv(groups);
    const r = updateCamera(dt, time);
    // shared uniforms that depend on the camera
    G.uProj.value = bh() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
    G.uCamRight.value.setFromMatrixColumn(camera.matrixWorld, 0);
    G.uCamUp.value.setFromMatrixColumn(camera.matrixWorld, 1);
    // ambient flow (snow streams past the eagle, pollen drifts, marine snow flows past the whale)
    ambOffset.x += (-1.4 * W.w0 + 0.08 * W.w1 - 1.1 * W.w2) * dt;
    ambOffset.y += (-1.3 * W.w0 + 0.12 * W.w1 + 0.2 * W.w2) * dt;
    ambOffset.z += (0.35 * W.w0 + 0.05 * W.w1 + 0.15 * W.w2) * dt;
    // post
    dofMat.uniforms.uFocus.value = camera.position.distanceTo(target);
    dofMat.uniforms.uRange.value = Math.max(2.2, r * 0.3);
    dofMat.uniforms.uMaxBlur.value = 9 * DPR * dofK * (1 + FX.boost * 0.6);
    finalMat.uniforms.uCA.value = FX.ca; finalMat.uniforms.uZoom.value = FX.zoom; finalMat.uniforms.uFlash.value = FX.flash;
    // auto cycle
    if (S.started && !S.busy) { S.hold += dt; if (S.hold >= HOLD) next(); }
    holdBar.style.transform = `scaleX(${S.busy ? 0 : Math.min(1, S.hold / HOLD)})`;
    // render
    renderer.setRenderTarget(sceneRT); renderer.render(scene, camera); renderer.setRenderTarget(null);
    composer.render(dt);
    // perf meter + one-step adaptive resolution
    fpsAcc += dt; fpsN++;
    if (fpsAcc > 0.5) {
      const fps = fpsN / fpsAcc; $('#mFps').textContent = fps.toFixed(0);
      if (fps < 38 && time > 6) slow++; else slow = 0;
      if (slow >= 4 && !degraded && DPR > 1) { degraded = true; DPR = 1; onResize(); }
      fpsAcc = 0; fpsN = 0;
    }
  });
}

function onResize() {
  renderer.setPixelRatio(DPR); renderer.setSize(innerWidth, innerHeight);
  U.uMaxPt.value = 18 * DPR;
  composer.setPixelRatio(DPR); composer.setSize(innerWidth, innerHeight);
  sceneRT.setSize(bw(), bh());
  dofMat.uniforms.uRes.value.set(bw(), bh()); finalMat.uniforms.uRes.value.set(bw(), bh());
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', onResize);

boot().catch(err => { console.error(err); $('#err').style.display = 'grid'; $('#err').textContent = 'Erreur d’initialisation : ' + err.message; });
</script>
</body>
